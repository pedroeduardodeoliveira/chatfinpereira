<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Bot WhatsApp</title>

    <link rel="icon" type="image/png" href="favicon.png" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-image: url("background.png");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 20px auto;
        padding: 10px;
        backdrop-filter: blur(3px);
        color: #ffffff;
      }

      h1 {
        text-align: center;
        margin-bottom: 6px;
      }

      .subtitle {
        text-align: center;
        font-size: 0.9rem;
        opacity: 0.9;
      }

      .top-status-row {
        display: flex;
        justify-content: center;
        margin: 16px 0;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background-color: rgba(0, 0, 0, 0.6);
        font-size: 0.9rem;
      }

      .blink {
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        50% {
          filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.8));
        }
      }

      .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .card,
      .log-card {
        background-color: rgba(51, 51, 51, 0.7);
        border-radius: 10px;
        padding: 20px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      h2 {
        margin-top: 0;
        font-size: 1rem;
      }

      label {
        display: block;
        margin-top: 10px;
        font-size: 0.9rem;
      }

      input,
      textarea {
        width: 100%;
        padding: 6px 8px;
        margin-top: 4px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background-color: rgba(0, 0, 0, 0.3);
        color: #fff;
      }

      textarea {
        min-height: 70px;
      }

      button {
        margin-top: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, #22c55e, #16a34a);
      }

      .btn-danger {
        background: linear-gradient(135deg, #ef4444, #b91c1c);
      }

      .status {
        font-size: 0.85rem;
        margin-top: 6px;
      }

      pre {
        max-height: 260px;
        overflow-y: auto;
        font-size: 0.8rem;
        background: rgba(0, 0, 0, 0.35);
        padding: 8px;
        border-radius: 6px;
        white-space: pre-wrap;
      }

      /* MODAL QR */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .modal-box {
        background: rgba(40, 40, 40, 0.9);
        padding: 20px;
        border-radius: 12px;
        text-align: center;
      }

      #qr-container {
        background: #fff;
        padding: 12px;
        border-radius: 10px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <h1>Bot WhatsApp</h1>
    <p class="subtitle">Envio manual de mensagens via planilha</p>

    <div style="text-align:center;">
      <button id="open-qr">Mostrar QR Code</button>
    </div>

    <div class="top-status-row">
      <div class="status-pill">
        <span id="emoji" class="blink">⚠️</span>
        <span id="wa-status">Carregando...</span>
      </div>
    </div>

    <div class="card-container">
      <div class="card">
        <h2>Envio manual (planilha)</h2>
        <button id="send-now" class="btn-danger">Enviar agora</button>
        <div id="send-status" class="status"></div>
      </div>

      <div class="card">
        <h2>Envio de teste</h2>
        <label>Telefone</label>
        <input id="test-phone" placeholder="Ex: 55999999999" />
        <label>Mensagem</label>
        <textarea id="test-text">Mensagem de teste</textarea>
        <button id="test-send">Enviar teste</button>
        <div id="test-status" class="status"></div>
      </div>
    </div>

    <div class="log-card">
      <h2>Log</h2>
      <pre id="log"></pre>
    </div>

    <!-- MODAL QR -->
    <div class="modal" id="qr-modal">
      <div class="modal-box">
        <button id="close-qr">Fechar</button>
        <div id="qr-container"></div>
      </div>
    </div>

    <script>
      async function loadStatus() {
        const res = await fetch("/api/status");
        const data = await res.json();

        const wa = document.getElementById("wa-status");
        const emoji = document.getElementById("emoji");

        if (data.whatsappReady) {
          wa.textContent = "WhatsApp conectado";
          wa.style.color = "#4ade80";
          emoji.textContent = "🟢";
        } else {
          wa.textContent = "Aguardando QR";
          wa.style.color = "#facc15";
          emoji.textContent = "⚠️";
        }
      }

      async function loadLog() {
        const res = await fetch("/api/log");
        const data = await res.json();

        document.getElementById("log").innerHTML = (data.log || [])
          .map((l) => {
            const t = new Date(l.timestamp).toLocaleTimeString("pt-BR");
            return `[${t}] ${l.phone} - ${l.info}`;
          })
          .join("\n");
      }

      document.getElementById("send-now").onclick = async () => {
        const status = document.getElementById("send-status");
        status.textContent = "Enviando...";
        const res = await fetch("/api/send-now", { method: "POST" });
        status.textContent = res.ok ? "Envio concluído" : "Erro no envio";
        loadLog();
      };

      document.getElementById("test-send").onclick = async () => {
        const phone = test-phone.value.trim();
        const text = test-text.value.trim();
        const status = document.getElementById("test-status");

        const res = await fetch("/api/send-test", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, text }),
        });

        const data = await res.json();
        status.textContent = res.ok ? "Teste enviado" : data.error;
        loadLog();
      };

      document.getElementById("open-qr").onclick = async () => {
        document.getElementById("qr-modal").style.display = "flex";
        const res = await fetch("/api/qr");
        const data = await res.json();
        const div = document.getElementById("qr-container");
        div.innerHTML = "";
        if (data.qr)
          new QRCode(div, { text: data.qr, width: 260, height: 260 });
      };

      document.getElementById("close-qr").onclick = () => {
        document.getElementById("qr-modal").style.display = "none";
      };

      setInterval(() => {
        loadStatus();
        loadLog();
      }, 15000);

      loadStatus();
      loadLog();
    </script>
  </body>
</html>
